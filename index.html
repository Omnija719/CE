<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Common Enemies — Electronic Metal · Hip-Hop. Music and merch coming soon." />
  <title>Common Enemies</title>
  <link rel="icon" href="assets/images/logo-white.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="grid-bg" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="#top" aria-label="Common Enemies home">
      <img src="assets/images/logo-white.svg" alt="" class="brand-mark" width="36" height="43" />
      <span class="brand-text">Common Enemies</span>
    </a>
    <nav class="nav" aria-label="Primary">
      <a href="#platforms">Links</a>
      <a href="#merch">Merch</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-glow" aria-hidden="true"></div>
      <div class="hero-inner">
        <div class="hero-logo-wrap">
          <img
            src="assets/images/logo-white.svg"
            alt="Common Enemies logo"
            class="hero-logo"
            width="200"
            height="240"
          />
        </div>

        <h1 id="hero-title" class="sr-only">Common Enemies</h1>
        <img
          src="assets/images/wordmark-web.png"
          alt="Common Enemies"
          class="hero-wordmark"
          width="900"
          height="70"
        />

        <p class="hero-tagline">
          <span>Electronic</span>
          <span class="dot" aria-hidden="true"></span>
          <span>Metal</span>
          <span class="dot" aria-hidden="true"></span>
          <span>Hip-Hop</span>
        </p>

        <div class="hero-ctas">
          <button type="button" class="btn btn-primary coming-soon-trigger" data-label="Music">
            Listen
            <span class="btn-badge">Coming Soon</span>
          </button>
          <button type="button" class="btn btn-ghost coming-soon-trigger" data-label="Merch">
            Shop
            <span class="btn-badge">Coming Soon</span>
          </button>
        </div>
      </div>

      <div class="scroll-hint" aria-hidden="true">
        <span></span>
      </div>
    </section>

    <section id="platforms" class="section platforms" aria-labelledby="platforms-title">
      <div class="section-inner">
        <header class="section-header">
          <p class="section-eyebrow">Connect</p>
          <h2 id="platforms-title" class="section-title">Find Us</h2>
          <p class="section-sub">Platforms and stores — dropping soon.</p>
        </header>

        <ul class="platform-grid">
          <li>
            <button type="button" class="platform-card coming-soon-trigger" data-label="YouTube" aria-disabled="true">
              <span class="platform-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.5 31.5 0 0 0 0 12a31.5 31.5 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.5 31.5 0 0 0 24 12a31.5 31.5 0 0 0-.5-5.8zM9.75 15.5v-7l6.5 3.5-6.5 3.5z"/></svg>
              </span>
              <span class="platform-name">YouTube</span>
              <span class="platform-badge">Coming Soon</span>
            </button>
          </li>
          <li>
            <button type="button" class="platform-card coming-soon-trigger" data-label="Spotify" aria-disabled="true">
              <span class="platform-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.5 17.3a.75.75 0 0 1-1.03.25c-2.82-1.72-6.37-2.11-10.55-1.16a.75.75 0 1 1-.33-1.46c4.56-1.04 8.48-.59 11.66 1.34a.75.75 0 0 1 .25 1.03zm1.47-3.27a.94.94 0 0 1-1.29.31c-3.23-1.98-8.15-2.56-11.96-1.4a.94.94 0 1 1-.54-1.8c4.34-1.31 9.74-.67 13.45 1.6a.94.94 0 0 1 .34 1.29zm.13-3.4C15.3 8.4 8.85 8.18 5.16 9.3a1.12 1.12 0 1 1-.65-2.15c4.24-1.29 11.28-1.04 15.73 1.6a1.12 1.12 0 0 1-1.14 1.93z"/></svg>
              </span>
              <span class="platform-name">Spotify</span>
              <span class="platform-badge">Coming Soon</span>
            </button>
          </li>
          <li>
            <button type="button" class="platform-card coming-soon-trigger" data-label="Bandcamp" aria-disabled="true">
              <span class="platform-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M0 18.75l7.44-13.5h16.56l-7.44 13.5H0z"/></svg>
              </span>
              <span class="platform-name">Bandcamp</span>
              <span class="platform-badge">Coming Soon</span>
            </button>
          </li>
          <li>
            <button type="button" class="platform-card coming-soon-trigger" data-label="Etsy" aria-disabled="true">
              <span class="platform-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M8.5 7.2c.5-2.2 2.2-3.4 4.6-3.4 1.7 0 3.1.6 4.1 1.7l-1.6 1.6c-.7-.7-1.5-1-2.4-1-1.3 0-2.2.7-2.5 1.9-.1.4-.1.8-.1 1.3h4.9c2.3 0 3.7 1.3 3.7 3.4 0 2.4-1.8 4.1-4.5 4.1-1.5 0-2.7-.5-3.6-1.3v3.8H8.5V7.2zm2.6 5.6c.3 1.2 1.2 1.9 2.5 1.9 1.2 0 2-.7 2-1.7 0-.9-.6-1.4-1.8-1.4h-2.8c0 .4.05.8.1 1.2z"/></svg>
              </span>
              <span class="platform-name">Etsy</span>
              <span class="platform-badge">Coming Soon</span>
            </button>
          </li>
        </ul>
      </div>
    </section>

    <section id="merch" class="section merch" aria-labelledby="merch-title">
      <div class="merch-bg" aria-hidden="true"></div>
      <div class="merch-overlay" aria-hidden="true"></div>
      <div class="section-inner merch-content">
        <p class="section-eyebrow">Gear</p>
        <h2 id="merch-title" class="section-title">Merch</h2>
        <p class="merch-copy">Tees and more on Etsy. Stay sharp.</p>
        <button type="button" class="btn btn-primary coming-soon-trigger" data-label="Etsy store">
          Shop Etsy
          <span class="btn-badge">Coming Soon</span>
        </button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <img src="assets/images/logo-white.svg" alt="" width="28" height="34" />
        <span>Common Enemies</span>
      </div>
      <p class="footer-copy">&copy; <span id="year"></span> Common Enemies. All rights reserved.</p>
      <ul class="footer-links">
        <li><button type="button" class="footer-link coming-soon-trigger" data-label="YouTube">YT</button></li>
        <li><button type="button" class="footer-link coming-soon-trigger" data-label="Spotify">SP</button></li>
        <li><button type="button" class="footer-link coming-soon-trigger" data-label="Bandcamp">BC</button></li>
        <li><button type="button" class="footer-link coming-soon-trigger" data-label="Etsy">ET</button></li>
      </ul>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/main.js"></script>
</body>
</html>
